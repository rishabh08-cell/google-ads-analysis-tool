<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Report</title>
    <style>
          *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e5e5e5;min-height:100vh;padding:2rem}.wrap{max-width:720px;margin:0 auto}.loading{text-align:center;padding:4rem 0;color:#777}.error{text-align:center;padding:4rem 0;color:#f87171}.status-bar{display:inline-block;padding:.35rem .85rem;border-radius:20px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1rem}.status-healthy{background:#052e16;color:#4ade80}.status-warning{background:#422006;color:#fbbf24}.status-critical{background:#3d1414;color:#f87171}.meta{font-size:.8rem;color:#555;margin-bottom:.75rem}h1{font-size:1.75rem;font-weight:700;color:#fff;margin-bottom:.75rem;line-height:1.3}.summary{font-size:1.05rem;color:#999;line-height:1.7;margin-bottom:2rem}.section-title{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#555;margin:2rem 0 1rem}.signal{padding:1.25rem;background:#161616;border-radius:10px;border:1px solid #222;margin-bottom:.75rem}.signal-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}.signal-type{font-size:.7rem;font-weight:600;text-transform:uppercase;padding:.2rem .5rem;border-radius:4px}.type-risk{background:#3d1414;color:#f87171}.type-positive{background:#052e16;color:#4ade80}.type-watch{background:#422006;color:#fbbf24}.signal h3{font-size:.95rem;font-weight:600;color:#fff}.signal p{font-size:.85rem;color:#888;line-height:1.6;margin-top:.25rem}.rec{padding:1.5rem;background:#0f172a;border:1px solid #1e3a5f;border-radius:10px;margin-bottom:.75rem}.rec h3{font-size:1rem;font-weight:600;color:#93c5fd;margin-bottom:.4rem}.rec p{font-size:.9rem;color:#94a3b8;line-height:1.6}table{width:100%;border-collapse:collapse;margin-top:.5rem;font-size:.85rem}th{text-align:left;padding:.6rem .75rem;color:#555;font-weight:500;font-size:.75rem;text-transform:uppercase;border-bottom:1px solid #222}td{padding:.7rem .75rem;border-bottom:1px solid #1a1a1a;color:#ccc}.actions{margin-top:2.5rem;display:flex;gap:1rem}.btn-outline{padding:.6rem 1.25rem;background:0 0;border:1px solid #333;color:#999;border-radius:6px;cursor:pointer;font-size:.85rem;text-decoration:none}.btn-outline:hover{border-color:#555;color:#fff}.btn-danger{padding:.6rem 1.25rem;background:0 0;border:1px solid #5c2020;color:#f87171;border-radius:6px;cursor:pointer;font-size:.85rem}.btn-danger:hover{background:#3d1414}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </style>
  </head>
  <body>
      <div class="wrap">
            <div id="loading" class="loading">Loading report...</div>div>
            <div id="report" style="display:none"></div>div>
            <div id="error" class="error" style="display:none"></div>div>
      </div>div>
      <script>
            const reportId = window.location.pathname.split('/').pop();

            async function loadReport() {
                    try {
                              const res = await fetch('/api/reports/' + reportId);
                              if (!res.ok) { const e = await res.json(); throw new Error(e.error); }
                              const data = await res.json();
                              render(data);
                    } catch (e) {
                              document.getElementById('loading').style.display = 'none';
                              const el = document.getElementById('error');
                el.textContent = e.message || 'Report not found';
                              el.style.display = 'block';
                    }
            }

            function render(data) {
                    document.getElementById('loading').style.display = 'none';
                    const r = data.report;
                    const m = data.meta;
                    const sc = 'status-' + (r.status || 'healthy');
                    let h = '';
                    h += '<span class="status-bar ' + sc + '">' + (r.status_label || r.status) + '</span>';
                    h += '<div class="meta">' + esc(m.account_name || '') + ' &middot; ' + esc(r.period || '') + '</div>';
                    h += '<h1>' + esc(r.headline) + '</h1>';
                    h += '<p class="summary">' + esc(r.summary) + '</p>';
                    if (r.signals && r.signals.length) {
                              h += '<div class="section-title">Signals</div>';
                              r.signals.forEach(function(s) {
                                          h += '<div class="signal"><div class="signal-header"><span class="signal-type type-' + s.type + '">' + s.type + '</span><h3>' + esc(s.title) + '</h3></div><p>' + esc(s.detail) + '</p></div>';
                              });
                    }
                                      if (r.recommendation) {
                                                h += '<div class="section-title">Recommendation</div>';
                                                                    h += '<div class="rec"><h3>' + esc(r.recommendation.title) + '</h3><p>' + esc(r.recommendation.detail) + '</p></div>';
                                      }
                    if (r.themes && r.themes.length) {
                              h += '<div class="section-title">Themes</div><table><thead><tr><th>Theme</th><th>ROAS</th><th>Spend</th><th>CPA</th><th>Status</th></tr></thead><tbody>';
                              r.themes.forEach(function(t) {
                                          h += '<tr><td>' + esc(t.name) + '</td><td>' + fmt(t.roas) + '</td><td>$' + fmt(t.spend) + '</td><td>' + (t.cpa ? '$' + fmt(t.cpa) : '-') + '</td><td>' + (t.status || '-') + '</td></tr>';
                              });
                              h += '</tbody></table>';
                    }
                    h += '<div class="actions"><a href="/" class="btn-outline">New Report</a><button class="btn-danger" onclick="del()">Delete Report</button></div>';
                    document.getElementById('report').innerHTML = h;
                    document.getElementById('report').style.display = 'block';
                    document.title = (r.headline || 'Report') + ' - Google Ads Analysis';
                      }

            async function del() {
                    if (!confirm('Delete this report?')) return;
                                                  await fetch('/api/reports/' + reportId, {method:'DELETE'});
                    window.location.href = '/';
            }

            function esc(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
            function fmt(n) { return n != null ? Number(n).toFixed(2) : '-'; }

            loadReport();
      </script>
  </body>
</html>html>
      </script>
  </body>
    </style></title>
  </head>
