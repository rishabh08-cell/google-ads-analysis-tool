<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Generate Report</title>
    <style>
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e5e5e5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
          .container { max-width: 480px; width: 100%; padding: 2rem; }
          h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; color: #fff; }
          .desc { color: #777; margin-bottom: 2rem; font-size: 0.95rem; }
          label { display: block; font-size: 0.85rem; font-weight: 500; color: #999; margin-bottom: 0.5rem; }
          select, .btn { width: 100%; padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.95rem; border: 1px solid #333; background: #161616; color: #e5e5e5; margin-bottom: 1.25rem; appearance: none; cursor: pointer; }
          select:focus { outline: none; border-color: #555; }
          .btn { background: #fff; color: #0a0a0a; font-weight: 600; border: none; cursor: pointer; transition: opacity 0.2s; text-align: center; }
          .btn:hover { opacity: 0.85; }
          .btn:disabled { opacity: 0.4; cursor: not-allowed; }
          .progress { display: none; text-align: center; margin-top: 1.5rem; }
          .progress .spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
          @keyframes spin { to { transform: rotate(360deg); } }
          .progress .step { color: #777; font-size: 0.9rem; }
          .error { background: #3d1414; border: 1px solid #5c2020; color: #f87171; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; display: none; }
          .back { display: inline-block; color: #555; text-decoration: none; font-size: 0.85rem; margin-bottom: 1.5rem; }
          .back:hover { color: #999; }
        </style>
  </head>
  <body>
      <div class="container">
            <a href="/" class="back">Back</a>a>
            <h1>Generate Report</h1>
          <p class="desc">Select an account and time period.</p>p>
          <div id="error" class="error"></div>div>
          <div id="form">
                <label for="account">Google Ads Account</label>label>
                <select id="account"><option>Loading accounts...</option></select>select>
                <label for="period">Reporting Period</label>label>
                <select id="period">
                        <option value="mtd">Month to Date</option>
                        <option value="last7">Last 7 Days</option>
                        <option value="last30">Last 30 Days</option>
                </select>select>
                <button class="btn" id="generateBtn" onclick="generate()" disabled>Generate Report</button>button>
          </div>div>
          <div id="progress" class="progress">
                <div class="spinner"></div>div>
                <div class="step" id="stepText">Fetching account data...</div>div>
          </div>div>
      </div>div>
    <script>
          const params = new URLSearchParams(window.location.search);
          const token = params.get('access_token');
          if (!token) { window.location.href = '/?error=auth_failed'; }

          async function loadAccounts() {
                  try {
                            const res = await fetch('/api/reports/accounts', { headers: { Authorization: 'Bearer ' + token } });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error);
                            const sel = document.getElementById('account');
                            sel.innerHTML = data.accounts.map(a => '<option value="' + a.id + '">' + a.id + ' (' + a.name + ')</option>').join('');
                            document.getElementById('generateBtn').disabled = false;
                  } catch (e) {
                            showError('Failed to load accounts: ' + e.message);
                  }
          }

          async function generate() {
                  const customerId = document.getElementById('account').value;
                  const period = document.getElementById('period').value;
                  document.getElementById('form').style.display = 'none';
                  document.getElementById('progress').style.display = 'block';
                  const steps = ['Fetching account data...', 'Inferring campaign themes...', 'Detecting anomalies...', 'Generating executive analysis...', 'Building report...'];
                  let i = 0;
                  const interval = setInterval(() => { if (i < steps.length) document.getElementById('stepText').textContent = steps[i++]; }, 3000);
                  try {
                            const res = await fetch('/api/reports/generate', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                                        body: JSON.stringify({ customer_id: customerId, period_type: period })
                            });
                            clearInterval(interval);
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.error);
                            window.location.href = '/report/' + data.report_id;
                  } catch (e) {
                            clearInterval(interval);
                            document.getElementById('progress').style.display = 'none';
                            document.getElementById('form').style.display = 'block';
                            showError('Report generation failed: ' + e.message);
                  }
          }

          function showError(msg) {
                  const el = document.getElementById('error');
                  el.textContent = msg;
                  el.style.display = 'block';
          }

          loadAccounts();
    </script>
  </body>
</html>html>
